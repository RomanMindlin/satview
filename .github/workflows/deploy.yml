name: Deploy to remote server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from template
        run: |
          envsubst < .env.template > .env
        env:
          EUMETSAT_KEY: ${{ secrets.EUMETSAT_KEY }}
          EUMETSAT_SECRET: ${{ secrets.EUMETSAT_SECRET }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          CDSE_USER: ${{ secrets.CDSE_USER }}
          CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}

      # config.yaml is not in git: it must already be in the target folder on the server.
      # output/ and cache/ there are left alone.
      - name: Copy app + .env to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SEHEL_SSH_KEY }}
          source: "./"
          target: /home/mindlin/satview/

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SEHEL_SSH_KEY }}
          script: |
            cd /home/mindlin/satview
            test -f config.yaml || { echo "config.yaml missing in /home/mindlin/satview"; exit 1; }
            mkdir -p output cache
            docker compose -f docker-compose.yaml up -d --build
            docker image prune -f
