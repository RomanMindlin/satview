[project]
name = "satview"
version = "0.1.0"
description = "Download recent satellite scenes and render visible-light pictures of Israel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pyproj",
    "pyresample",
    "satpy==0.60.0",  # FCI reader is beta: upgrade deliberately, check the regression test
    "pyspectral",
    "pyorbital",
    "hdf5plugin",
    "h5netcdf",
    "netCDF4",
    "eumdac",
    "earthaccess",
    "requests",
    "pyshp",
    "pillow",
    "imageio",
    "imageio-ffmpeg",
    "rasterio",
    "pyyaml",
    "pydantic>=2",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "rioxarray"]  # rioxarray: Satpy generic_image reader used in tests

[project.scripts]
satview = "satview.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["satview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
